; 根目录的 pytest 入口配置。
;
; 作用：让你**在仓库根目录**也能直接运行测试，无需先 cd 到 backend/：
;
;     uv run --project backend pytest
;
; 为什么需要它：pytest 从当前目录**向上**查找配置文件，不会向下找。
; 在仓库根目录运行时找不到 backend/pyproject.toml，于是既不知道 testpaths，
; 也不会把 backend/ 加进 sys.path —— 结果每条用例都报
; ModuleNotFoundError: No module named 'app'。
;
; 本文件只设置「找到测试」和「能让 app 被导入」这两件事；
; 其余 pytest 配置（addopts、filterwarnings、命名规则）的**唯一来源**仍是
; backend/pyproject.toml —— 从 backend/ 目录运行时以那份为准。

[pytest]
testpaths = backend/tests
; 相对于本文件所在目录（仓库根）解析，即把 backend/ 加入 sys.path
pythonpath = backend
