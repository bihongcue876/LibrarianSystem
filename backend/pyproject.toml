[project]
name = "library-management-system"
version = "0.1.0"
description = "AI时代图书管理系统 —— 《软件设计与体系结构》实验二后端（FastAPI 分层架构）"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
filterwarnings = [
    # starlette 1.6 对 httpx TestClient 的迁移提示，不影响测试正确性
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
